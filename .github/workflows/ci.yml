name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: ktlint
        run: ./gradlew :mebius:ktlintCheck

      - name: detekt
        run: ./gradlew :mebius:detekt

      - name: Unit tests
        run: ./gradlew :mebius:testReleaseUnitTest

      - name: Assemble release AAR
        run: ./gradlew :mebius:assembleRelease

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: mebius-aar
          path: mebius/build/outputs/aar/*.aar
