name: Release to Maven Central

# Publishes io.mebius:mebius-android-sdk to Maven Central so anyone, anywhere,
# can use it with just:
#   implementation("io.mebius:mebius-android-sdk:<version>")
#
# Trigger: push a version tag, e.g.
#   git tag v0.1.0 && git push origin v0.1.0
#
# Required repo secrets (Settings > Secrets and variables > Actions):
#   MAVEN_CENTRAL_USERNAME        Central Portal token username
#   MAVEN_CENTRAL_PASSWORD        Central Portal token password
#   SIGNING_KEY                   ASCII-armored GPG secret key (full block)
#   SIGNING_KEY_PASSWORD          passphrase for that key
#
# One-time setup (only you can do these): see PUBLISHING.md.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      # The one-time setup in PUBLISHING.md is the owner's to do, and until it is
      # done every `v*` tag pushed for an ordinary release turned this workflow
      # red. Absent credentials are not a build failure, so say so and stop.
      - name: Check release credentials
        id: creds
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
        run: |
          if [ -z "$SIGNING_KEY" ] || [ -z "$MAVEN_CENTRAL_USERNAME" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Maven Central credentials are not configured, so this tag was not published. See PUBLISHING.md. JitPack serves this tag either way."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish + release to Maven Central
        if: steps.creds.outputs.ready == 'true'
        run: ./gradlew :mebius:publishAndReleaseToMavenCentral --no-daemon --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
